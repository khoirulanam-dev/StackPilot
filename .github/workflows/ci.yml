name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: stackpilot_test
          POSTGRES_PASSWORD: stackpilot_test_password
          POSTGRES_DB: stackpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stackpilot_test -d stackpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify Go Module Dependencies
        run: go mod verify

      - name: Verify Go Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        env:
          STACKPILOT_TEST_DATABASE_URL: postgres://stackpilot_test:stackpilot_test_password@127.0.0.1:5432/stackpilot_test?sslmode=disable
        run: go test ./...

      - name: Go Test Race
        env:
          STACKPILOT_TEST_DATABASE_URL: postgres://stackpilot_test:stackpilot_test_password@127.0.0.1:5432/stackpilot_test?sslmode=disable
        run: go test -race ./...

      - name: Go Build Controller
        run: go build -o build/stackpilot-controller ./cmd/controller

      - name: Go Build Agent
        run: go build -o build/stackpilot-agent ./cmd/agent

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          working-directory: web
          runtime: node@24
          require-lockfile: true
          install: false

      - name: Install Frontend Dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        working-directory: web
        run: pnpm build
